<!-- it's a TIC TAC TOE game -->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            width: 100vw;
            height: auto;
            min-width: 1000px;
            min-height: 500px;
            display: flexbox;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            background-color: rgb(202, 207, 255);
            text-align: center;
        }

        .box1 {
            background-color: lightpink;
            width: 600px;
            height: auto;
            padding: 10px 0px 10px 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: auto;
            flex-wrap: wrap;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 5px;
        }

        .btn {
            background-color: rgb(233, 250, 255);
            width: 180px;
            height: 180px;
            margin: 1px;
            border-radius: 0px;
            font-size: 50px;
            border: none;
            box-shadow: rgba(0, 0, 0, 0.12) 0px 1px 3px, rgba(0, 0, 0, 0.24) 0px 1px 5px;
        }

        .msgbox {
            width: auto;
            color: blue;
            font-size: 8vmin;
            margin: auto;
            border-radius: 20px;
            text-align: center;

        }

        #msg {
            color: rgb(255, 229, 85);

        }

        .hide {
            display: none;
        }
    </style>



</head>

<body>
    <h1>TIC-TAC-TOE</h1>


    <div class="msgbox hide" style="background-color: aquamarine; margin: 20px;">
        <p id="msg"></p>
        <button id="new-btn" style=" margin: 40px; width: 100px; height: 50px; border: 2px solid blueviolet; border-radius: 20px; "> New Game </button>
    </div>


    <div class="box1">
        <button class="btn" style="border-bottom: 5px solid black; border-right: 5px solid black;"> </button>
        <button class="btn" style="border-bottom: 5px solid black; border-right: 5px solid black;"> </button>
        <button class="btn" style="border-bottom: 5px solid black;"> </button>
        <button class="btn" style="border-bottom: 5px solid black; border-right: 5px solid black;"> </button>
        <button class="btn" style="border-bottom: 5px solid black; border-right: 5px solid black;"> </button>
        <button class="btn" style="border-bottom: 5px solid black;"> </button>
        <button class="btn" style="border-right: 5px solid black;"> </button>
        <button class="btn" style="border-right: 5px solid black;"> </button>
        <button class="btn"> </button>

    </div>
   

    <button id="rstbtn"
        style=" margin: 40px; width: 100px; height: 50px; border: 2px solid blueviolet; border-radius: 20px; ">Reset
        Game</button>







    <script>


        let buttons = document.querySelectorAll(".btn");
        let resetBtn = document.querySelector("#rstbtn");
        let newGameBtn = document.querySelector("#new-btn");
        let msgbox = document.querySelector(".msgbox");
        let msg = document.querySelector("#msg");

        let turnO = true; //playerX, playerO
        let count = 0; //To Track Draw

        const winPatterns = [
            [0, 1, 2],[0, 3, 6],[0, 4, 8],[1, 4, 7],[2, 5, 8],[2, 4, 6],[3, 4, 5],[6, 7, 8],
        ];

        const resetGame = () => {
            turnO = true;
            count = 0;
            enableBoxes();
            msgbox.classList.add("hide");
        };

        buttons.forEach((btn) => {
            btn.addEventListener("click", () => {
                if (turnO) {
                    //playerO
                    btn.innerText = "O";
                    turnO = false;
                } else {
                    //playerX
                    btn.innerText = "X";
                    turnO = true;
                }
                btn.disabled = true;
                count++;

                let isWinner = checkWinner();

                if (count === 9 && !isWinner) {
                    gameDraw();
                    
                }
            });
        });

        const gameDraw = () => {
            msg.innerText = `Game was a Draw.`;
            msgbox.classList.remove("hide");
            disableBoxes();
        };

        const disableBoxes = () => {
            for (let btn of buttons) {
                btn.disabled = true;
            }
        };

        const enableBoxes = () => {
            for (let btn of buttons) {
                btn.disabled = false;
                btn.innerText = "";
            }
        };

        const showWinner = (winner) => {
            
            msg.innerText = `Congratulations, Winner is ${winner}`;
            
            msgbox.classList.remove("hide");
            disableBoxes();
            
        };

        const checkWinner = () => {
            for (let pattern of winPatterns) {
                let pos1Val = buttons[pattern[0]].innerText;
                let pos2Val = buttons[pattern[1]].innerText;
                let pos3Val = buttons[pattern[2]].innerText;

                if (pos1Val != "" && pos2Val != "" && pos3Val != "") {
                    if (pos1Val === pos2Val && pos2Val === pos3Val) {
                        showWinner(pos1Val);
                        return true;
                    }
                }
            }
        };

        newGameBtn.addEventListener("click", resetGame);
        resetBtn.addEventListener("click", resetGame);





    </script>






</body>

</html>
